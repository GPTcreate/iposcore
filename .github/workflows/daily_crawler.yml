name: Daily IPO Crawler & AI Scoring

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 23:00)에 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 관리자가 깃허브 웹에서 수동으로도 실행 가능

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 종속 패키지 설치
        run: |
          pip install -r python_pipeline/requirements.txt

      - name: DART 공시 및 전문가 분석 스크립트 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python python_pipeline/analyzer.py

      - name: 변경 사항이 있는 경우 자동 커밋 및 푸시
        run: |
          git config --global user.name "IPO-Bot"
          git config --global user.email "bot@ipo-insights.kr"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "새로 변경된 공모주 데이터가 없습니다."
          else
            git commit -m "chore(auto): daily IPO data sync & AI scoring [skip ci]"
            git push
          fi
