name: Diagnose official source connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Compare bounded Node and IPv4 curl requests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const run = promisify(execFile);
          const targets = [
            ['opendart', 'https://opendart.fss.or.kr/api/list.json'],
            ['dart', 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261029000504'],
            ['kis', 'https://www.truefriend.com/main/research/corporate/ipo/Pre01.jsp'],
            ['ibk', 'https://www.ibks.com/hts/hts_noticelist.do?popup=Y'],
          ];
          const results = await Promise.all(targets.map(async ([name, url]) => {
            const result = { name };
            try { result.families = [...new Set((await dns.lookup(new URL(url).hostname, { all: true })).map(x => x.family))]; }
            catch { result.dnsFailed = true; }
            const started = Date.now();
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(7000), headers: { 'User-Agent': 'IPOScore-Connectivity-Check' } });
              result.nodeStatus = response.status;
              await response.body?.cancel();
            } catch (error) {
              result.nodeError = /^[A-Z_0-9]+$/.test(error?.cause?.code || '') ? error.cause.code : error?.name || 'Error';
            }
            result.nodeMs = Date.now() - started;
            try {
              const output = await run('curl', ['-4', '--silent', '--show-error', '--output', '/dev/null', '--connect-timeout', '5', '--max-time', '7', '--write-out', '%{http_code}', url], { timeout: 9000 });
              result.curl4Status = output.stdout.trim();
            } catch (error) { result.curl4Exit = Number.isInteger(error?.code) ? error.code : 'failed'; }
            return result;
          }));
          console.log(JSON.stringify(results, null, 2));
          NODE
