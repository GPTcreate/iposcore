name: Diagnose official source connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Probe response bodies with bounded requests
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const day = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replaceAll('-', '');
          const api = new URL('https://opendart.fss.or.kr/api/list.json');
          for (const [key, value] of Object.entries({ crtfc_key: process.env.DART_API_KEY || '', bgn_de: day, end_de: day, pblntf_detail_ty: 'C001', page_count: '1' })) api.searchParams.set(key, value);
          const targets = [
            ['api-default', api, undefined, true],
            ['api-browser', api, 'Mozilla/5.0', true],
            ['dart-collector', 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261029000504', 'IPOScore/1.0', false],
            ['dart-browser', 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261029000504', 'Mozilla/5.0', false],
          ];
          const results = await Promise.all(targets.map(async ([name, url, agent, isApi]) => {
            const result = { name }, started = Date.now();
            try {
              const response = await fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(15000), headers: agent ? { 'User-Agent': agent } : {} });
              result.httpStatus = response.status;
              const location = response.headers.get('location');
              if (location) { try { const u = new URL(location, url); result.redirectOrigin = u.origin; result.redirectPath = u.pathname; } catch { result.invalidRedirect = true; } }
              if (Number(response.headers.get('content-length')) > 2000000) { await response.body?.cancel(); result.oversized = true; }
              else {
                const body = await response.text();
                result.bodyLength = body.length;
                if (isApi) { try { const parsed = JSON.parse(body); result.dartStatus = /^\d{3}$/.test(parsed.status || '') ? parsed.status : 'INVALID'; result.count = parsed.total_count; } catch { result.invalidJson = true; } }
                else result.viewerNodeCount = (body.match(/node\d+\['text'\]/g) || []).length;
              }
            } catch (error) { result.error = /^[A-Z_0-9]+$/.test(error?.cause?.code || '') ? error.cause.code : error?.name || 'Error'; }
            result.ms = Date.now() - started;
            return result;
          }));
          console.log(JSON.stringify(results, null, 2));
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify one actual IPO with the deployed collector
        run: npm run verify:official -- --dry-run --stock optronics
