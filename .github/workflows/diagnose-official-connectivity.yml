name: Diagnose official source connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Probe response bodies with bounded requests
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const day = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replaceAll('-', '');
          const api = new URL('https://opendart.fss.or.kr/api/list.json');
          for (const [key, value] of Object.entries({ crtfc_key: process.env.DART_API_KEY || '', bgn_de: day, end_de: day, pblntf_detail_ty: 'C001', page_count: '1' })) api.searchParams.set(key, value);
          const targets = [
            ['api-default', api, undefined, true],
            ['api-browser', api, 'Mozilla/5.0', true],
            ['dart-collector', 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261029000504', 'IPOScore/1.0', false],
            ['dart-browser', 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261029000504', 'Mozilla/5.0', false],
          ];
          const results = await Promise.all(targets.map(async ([name, url, agent, isApi]) => {
            const result = { name }, started = Date.now();
            try {
              const response = await fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(15000), headers: agent ? { 'User-Agent': agent } : {} });
              result.httpStatus = response.status;
              const location = response.headers.get('location');
              if (location) { try { const u = new URL(location, url); result.redirectOrigin = u.origin; result.redirectPath = u.pathname; } catch { result.invalidRedirect = true; } }
              if (Number(response.headers.get('content-length')) > 2000000) { await response.body?.cancel(); result.oversized = true; }
              else {
                const body = await response.text();
                result.bodyLength = body.length;
                if (isApi) { try { const parsed = JSON.parse(body); result.dartStatus = /^\d{3}$/.test(parsed.status || '') ? parsed.status : 'INVALID'; result.count = parsed.total_count; } catch { result.invalidJson = true; } }
                else result.viewerNodeCount = (body.match(/node\d+\['text'\]/g) || []).length;
              }
            } catch (error) { result.error = /^[A-Z_0-9]+$/.test(error?.cause?.code || '') ? error.cause.code : error?.name || 'Error'; }
            result.ms = Date.now() - started;
            return result;
          }));
          console.log(JSON.stringify(results, null, 2));
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify one actual IPO with the deployed collector
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          cat > "$RUNNER_TEMP/iposcore-fetch-diag.cjs" <<'NODE'
          const original = globalThis.fetch;
          const safeError = error => ({ error: ['TypeError', 'Error', 'TimeoutError', 'AbortError', 'SyntaxError'].includes(error?.name) ? error.name : 'OtherError', code: /^[A-Z_0-9]{1,60}$/.test(error?.cause?.code || '') ? error.cause.code : undefined });
          globalThis.fetch = async function(input, init) {
            const u = new URL(String(input)), started = Date.now();
            const target = { host: u.hostname, path: u.pathname };
            const log = event => console.log(JSON.stringify({ diagnostic: true, ...target, ms: Date.now() - started, ...event }));
            log({ stage: 'start', cache: init?.cache, redirect: init?.redirect });
            try {
              const response = await original(input, init);
              log({ stage: 'headers', status: response.status, sameUrl: response.url === String(input), length: response.headers.get('content-length') });
              if (response.body) {
                const getReader = response.body.getReader.bind(response.body);
                response.body.getReader = function(...args) {
                  const reader = getReader(...args), read = reader.read.bind(reader); let bytes = 0;
                  reader.read = async function(...readArgs) {
                    try { const part = await read(...readArgs); bytes += part.value?.byteLength || 0; if (part.done) log({ stage: 'stream-done', bytes }); return part; }
                    catch (error) { log({ stage: 'stream-error', bytes, ...safeError(error) }); throw error; }
                  };
                  return reader;
                };
              }
              for (const method of ['text', 'json']) {
                const consume = response[method].bind(response);
                response[method] = async function() {
                  try { const value = await consume(); log({ stage: method + '-done', length: typeof value === 'string' ? value.length : undefined, apiStatus: method === 'json' && /^\d{3}$/.test(value?.status || '') ? value.status : undefined, count: method === 'json' ? value?.total_count : undefined }); return value; }
                  catch (error) { log({ stage: method + '-error', ...safeError(error) }); throw error; }
                };
              }
              return response;
            } catch (error) { log({ stage: 'fetch-error', ...safeError(error) }); throw error; }
          };
          NODE
          NODE_OPTIONS="--require=$RUNNER_TEMP/iposcore-fetch-diag.cjs" npm run verify:official -- --dry-run --stock optronics
      - name: Check the discovery request with the same safe tracing
        if: always()
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: NODE_OPTIONS="--require=$RUNNER_TEMP/iposcore-fetch-diag.cjs" npm run sync:ipos -- --dry-run --days 1
      - name: Probe two actual metric filings without saving data or caches
        if: always()
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NODE_OPTIONS: --require=${{ runner.temp }}/iposcore-fetch-diag.cjs
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const root = process.cwd(), temporary = process.env.RUNNER_TEMP;
          if (!temporary) throw new Error('The diagnostic temporary directory is unavailable.');
          const source = readFileSync(path.join(root, 'scripts', 'sync-financials.mjs'), 'utf8');
          const marker = 'const result = spawnSync(process.execPath';
          const boundary = source.indexOf(marker);
          if (boundary < 0 || source.indexOf(marker, boundary + marker.length) >= 0) throw new Error('The financial compilation runner changed.');
          const runner = path.join(temporary, 'iposcore-metric-probe-runner.mjs');
          const suffix = `
          const probe = path.join(output, 'metric-parser-probe.cjs');
          writeFileSync(probe, \`
          const { parseConfirmedFilingDetails } = require(\${JSON.stringify(path.join(output, 'src', 'lib', 'dartFilingSync.js'))});
          (async () => {
            for (const receiptNo of ['20261030000406', '20261028000157']) {
              const result = await parseConfirmedFilingDetails(receiptNo);
              const parsed = result ? Object.fromEntries(['confirmedPrice', 'circulatingSupplyRate', 'institutionalCompetitionRate', 'lockupCommitmentRate']
                .filter(field => typeof result[field] === 'number' && Number.isFinite(result[field]))
                .map(field => [field, result[field]])) : null;
              if (parsed) parsed.publicationPending = Boolean(result.publicationPending);
              console.log(JSON.stringify({ receiptNo, parsed }));
            }
          })().catch(() => { console.error('The read-only metric probe failed.'); process.exitCode = 1; });
          \`);
          const result = spawnSync(process.execPath, [probe], {
            cwd: root, stdio: 'inherit',
            env: { ...process.env, NODE_PATH: [path.join(root, 'node_modules'), process.env.NODE_PATH].filter(Boolean).join(path.delimiter) },
          });
          process.exit(result.status ?? 1);
          `;
          writeFileSync(runner, source.slice(0, boundary) + suffix);
          const result = spawnSync(process.execPath, [runner], { cwd: root, stdio: 'inherit', env: process.env });
          process.exit(result.status ?? 1);
          NODE

